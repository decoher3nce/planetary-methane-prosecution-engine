[project]
name = "planetary-methane-prosecution-engine"
version = "0.1.0"
description = "Turn spectral signatures into legal evidence — fuse multi-sensor methane detection into court-ready prosecution packages"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "shapely>=2.0",
    "geojson>=3.1",
    "pydantic>=2.6",
    "cryptography>=42.0",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
